name: Deployment recovery
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  deployment-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Real locks, signals, and isolated deployment regressions
        run: python -B -m unittest discover -s deploy/ubuntu/tests -v
