name: Application CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AWS_EC2_METADATA_DISABLED: 'true'
      MEMOVERSE_RUN_REAL_GENERATION: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install test dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Test backend contracts, isolation, and recovery
        run: python -B -m pytest backend/tests scripts/tests/test_capacity_benchmark.py -q -ra --basetemp "$RUNNER_TEMP/pytest-backend" --junitxml=test-results/backend.xml
      - name: Upload backend failure report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: backend-failure-report
          path: test-results/backend.xml
          if-no-files-found: ignore
          retention-days: 7

  subject-relief:
    name: Subject relief tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AWS_EC2_METADATA_DISABLED: 'true'
      PYTHONDONTWRITEBYTECODE: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      HF_HOME: ${{ runner.temp }}/subject-relief-huggingface
      TORCH_HOME: ${{ runner.temp }}/subject-relief-torch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            backend/requirements*.txt
            experiments/subject_relief/requirements-ci.txt
            .github/workflows/application-ci.yml
      - name: Install experiment test dependencies
        run: python -m pip install -r backend/requirements-dev.txt -r experiments/subject_relief/requirements-ci.txt
      - name: Install pinned CPU tensor runtime
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.11.0
      - name: Test geometry, segmentation contracts, lab API and workers
        run: python -B -m pytest experiments/subject_relief -q -ra -p no:cacheprovider --basetemp "$RUNNER_TEMP/pytest-subject-relief" --junitxml=test-results/subject-relief.xml
      - name: Upload experiment failure report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: subject-relief-failure-report
          path: test-results/subject-relief.xml
          if-no-files-found: ignore
          retention-days: 7

  subject-process:
    name: Subject process tests
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install process test runner
        run: python -m pip install pytest==9.1.1
      - name: Test real Windows worker lifetime and failure cleanup
        shell: pwsh
        run: python -B -m pytest experiments/subject_relief/test_lab_process.py -q -ra -p no:cacheprovider --basetemp "$env:RUNNER_TEMP/pytest-subject-process" --junitxml=test-results/subject-process.xml
      - name: Upload process failure report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: subject-process-failure-report
          path: test-results/subject-process.xml
          if-no-files-found: ignore
          retention-days: 7

  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: demo/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Check Web runtime contract
        run: npm run check:runtime
      - name: Test frontend logic
        run: npm run test:unit
      - name: Test experiment task state
        run: |
          mkdir -p test-results
          node --test --test-reporter=spec --test-reporter=junit --test-reporter-destination=stdout --test-reporter-destination=test-results/subject-state.xml ../experiments/subject_relief/lab_state.test.mjs
      - name: Type-check and build production assets
        run: npm run build
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Test Web interactions
        run: npm run test:web -- --reporter=line,junit --output=test-results/web
        env:
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: test-results/web-junit.xml
      - name: Test production loading and HTTP failure recovery
        run: npx playwright test --config=playwright.reliability.config.ts --reporter=line,junit --output=test-results/reliability
        env:
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: test-results/reliability-junit.xml
      - name: Upload frontend failure reports and traces
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: frontend-failure-reports
          path: demo/test-results/
          if-no-files-found: ignore
          retention-days: 7
