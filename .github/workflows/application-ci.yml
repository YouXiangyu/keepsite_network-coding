name: Application CI

on:
  pull_request:
  push:
    branches: [main, 'codex/**']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      redis:
        image: redis:8.2.10-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      AWS_EC2_METADATA_DISABLED: 'true'
      MEMOVERSE_TEST_REDIS_URL: redis://127.0.0.1:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install test dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Prepare and verify fixed OCR models
        run: |
          python -B scripts/prepare-ocr.py --destination "$RUNNER_TEMP/ocr-models" --execute
          echo "MEMOVERSE_TEST_OCR_MODEL_DIR=$RUNNER_TEMP/ocr-models" >> "$GITHUB_ENV"
      - name: Test backend contracts, isolation, and recovery
        run: python -B -m pytest backend/tests scripts/tests/test_capacity_benchmark.py scripts/tests/test_sync_benchmark.py scripts/tests/test_processing_benchmark.py scripts/tests/test_ticket_migration.py scripts/tests/test_ocr_preparation.py -q -ra --basetemp "$RUNNER_TEMP/pytest-backend" --junitxml=test-results/backend.xml
      - name: Upload backend failure report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: backend-failure-report
          path: test-results/backend.xml
          if-no-files-found: ignore
          retention-days: 7

  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: demo/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Check Web runtime contract
        run: npm run check:runtime
      - name: Test frontend logic
        run: npm run test:unit
      - name: Type-check and build production assets
        run: npm run build
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Test Web interactions
        run: npm run test:web -- --reporter=line,junit --output=test-results/web
        env:
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: test-results/web-junit.xml
      - name: Test production loading and HTTP failure recovery
        run: npx playwright test --config=playwright.reliability.config.ts --reporter=line,junit --output=test-results/reliability
        env:
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: test-results/reliability-junit.xml
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install local P2P fixture dependencies
        run: python -m pip install -r ../backend/requirements-dev.txt
      - name: Test real two-browser media transfer and fallback
        run: npm run test:p2p -- --reporter=line,junit --output=test-results/p2p
        env:
          AWS_EC2_METADATA_DISABLED: 'true'
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: test-results/p2p-junit.xml
      - name: Test benchmark accounting and isolated browser smoke matrix
        run: |
          node --test ../scripts/tests/browser-benchmark.test.mjs
          npm run build:benchmark
          node ../scripts/benchmark-browser.mjs --count 3 --sample 3 --output "$RUNNER_TEMP/m6-browser-smoke" --execute
        env:
          AWS_EC2_METADATA_DISABLED: 'true'
      - name: Upload frontend failure reports and traces
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: frontend-failure-reports
          path: |
            demo/test-results/
            ${{ runner.temp }}/m6-browser-smoke/
          if-no-files-found: ignore
          retention-days: 7

  android:
    name: Android tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install pinned Android platform and build tools
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile native application and instrumentation; run JVM contracts and Lint
        run: bash gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest :app:testDebugUnitTest :app:lintDebug
      - name: Upload Android verification reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: android-verification-reports
          path: |
            android/app/build/test-results/
            android/app/build/reports/
          if-no-files-found: ignore
          retention-days: 7
